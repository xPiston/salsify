name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # The lowest versions the constraints allow, so a dependency this
          # package claims to support is one it is actually tested against.
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: hash, json, mbstring
          coverage: none
          ini-values: error_reporting=E_ALL, date.timezone=UTC

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: composer test
        # Deprecations, notices and warnings fail the suite: see phpunit.xml.

  # The matrix above resolves one vendor tree per PHP version, and Laravel
  # pulls Symfony 7 into it - so "Symfony 6.4" is a claim that tree cannot
  # test. This job builds one that can.
  #
  # There is no Laravel 11 job: Composer refuses to install any 11.x release
  # now that they are all covered by security advisories, so it is not a
  # version anybody can be running.
  symfony-64:
    name: Symfony 6.4 (bundle only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: A vendor tree with Symfony 6.4 and no Laravel
        run: |
          composer remove --dev --no-update orchestra/testbench illuminate/support
          composer require --dev --no-update \
            "symfony/config:^6.4" \
            "symfony/dependency-injection:^6.4" \
            "symfony/http-kernel:^6.4" \
            "symfony/http-foundation:^6.4" \
            "symfony/http-client:^6.4"

      # Highest within 6.4, not lowest: 6.4.0 predates PHP 8.4 and spends the
      # run emitting its own deprecations. What is being claimed is the 6.4
      # LTS line, which is what its current patch is.
      - uses: ramsey/composer-install@v4

      # Every suite but the Laravel bridge, which has no framework to run in
      # here - and that is the point of the job.
      - run: vendor/bin/phpunit --testsuite unit,integration,symfony

  quality:
    name: Static analysis and style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: composer test:lint
      - run: composer analyse
      - run: composer audit --locked || composer audit

